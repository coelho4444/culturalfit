<title>Whoop Luanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300;400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#0a0907;
  --ink-2:#12100d;
  --ink-3:#1b1815;
  --rule:rgba(245,239,233,.10);
  --rule-2:rgba(245,239,233,.18);
  --bone:#f6f1ea;
  --bone-2:rgba(246,241,234,.72);
  --bone-3:rgba(246,241,234,.44);
  --acc:#e4572e;
  --acc-soft:rgba(228,87,46,.14);
  --rec:#39a857;
  --sleep:#3987e5;
  --font-disp:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Spline Sans Mono',ui-monospace,monospace;
  --gut:22px;
  --max:1180px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--ink);color:var(--bone);
  font-family:var(--font-body);font-size:16.5px;line-height:1.68;
  font-weight:400;letter-spacing:-.005em;
  overflow-x:hidden;
  padding-inline:var(--gut);
  padding-block:0 env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:var(--max);margin-inline:auto}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- TIPOGRAFIA EDITORIAL ---------- */
h1,h2,h3{font-family:var(--font-disp);font-weight:400;text-wrap:balance}
h1{
  font-size:clamp(46px,8.6vw,104px);
  line-height:.96;letter-spacing:-.025em;font-weight:400;
  font-variation-settings:'SOFT' 0,'WONK' 0;
}
h1 em,h2 em{font-style:italic;font-weight:400;color:var(--acc)}
h2.sec{
  font-size:clamp(34px,5.6vw,66px);
  line-height:1.01;letter-spacing:-.02em;margin-top:20px;font-weight:400;
}
h3{font-size:clamp(21px,2.6vw,29px);line-height:1.14;letter-spacing:-.015em;font-weight:500}
.eyebrow{
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bone-3);
}
p.lede{
  color:var(--bone-2);font-size:clamp(16.5px,1.85vw,20px);
  line-height:1.62;max-width:60ch;margin-top:22px;font-weight:300;
}
.kicker{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--bone-3);
}
section{padding-block:clamp(80px,12vw,150px);position:relative}
.section-head{max-width:800px}

/* ---------- CHROME ---------- */
.grain{
  position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.5;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:rgba(10,9,7,.72);backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--rule);
  margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);
}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:13px;max-width:var(--max);margin-inline:auto}
.brand{font-family:var(--font-disp);font-size:24px;font-weight:500;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand i{font-style:italic;color:var(--acc)}
.topstat{display:flex;gap:22px;align-items:center;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3)}
.topstat b{color:var(--bone-2);font-weight:500}
.topstat .hide-s{display:none}
@media(min-width:680px){.topstat .hide-s{display:inline}}
.top-cta{
  font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:.01em;
  background:var(--bone);color:var(--ink);padding:10px 18px;border-radius:100px;
  white-space:nowrap;transition:background .2s ease;
}
.top-cta:hover{background:var(--acc);color:#fff}
@media(max-width:600px){.topstat{display:none}}

/* ---------- BOTÕES ---------- */
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:.005em;
  padding:16px 28px;border-radius:100px;border:1px solid transparent;cursor:pointer;
  transition:transform .18s ease,background .2s ease,border-color .2s ease,color .2s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn-main{background:var(--bone);color:var(--ink)}
.btn-main:hover{background:var(--acc);color:#fff}
.btn-ghost{border-color:var(--rule-2);color:var(--bone);background:rgba(255,255,255,.03)}
.btn-ghost:hover{border-color:var(--bone-3);background:rgba(255,255,255,.07)}
.btn-wa{background:var(--acc);color:#fff}
.btn-wa:hover{background:#f06a41}

/* ---------- HERO: FOTOGRAFIA EM SANGRIA TOTAL ---------- */
.hero{margin-inline:calc(var(--gut) * -1);position:relative;isolation:isolate;overflow:hidden}
.hero-photo{position:absolute;inset:0;z-index:-2}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
.hero::after{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    linear-gradient(180deg,rgba(10,9,7,.92) 0%,rgba(10,9,7,.45) 26%,rgba(10,9,7,.72) 62%,var(--ink) 97%),
    linear-gradient(90deg,rgba(10,9,7,.86) 0%,rgba(10,9,7,.30) 52%,transparent 78%);
}
.hero-in{
  max-width:var(--max);margin-inline:auto;
  padding-inline:var(--gut);
  padding-block:clamp(76px,13vw,150px) clamp(58px,9vw,96px);
  min-height:min(88vh,860px);display:flex;flex-direction:column;justify-content:flex-end;
}
.hero-in > *{max-width:920px}
.hero h1{margin-top:26px;text-shadow:0 2px 40px rgba(0,0,0,.5)}
.hero .lede{max-width:52ch;color:var(--bone-2)}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.hero-credit{
  position:absolute;right:var(--gut);bottom:14px;z-index:2;
  font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(246,241,234,.30);
  writing-mode:vertical-rl;
}
@media(max-width:820px){.hero-credit{display:none}}

/* ---------- FAIXA DE NÚMEROS ---------- */
.facts{
  display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
  background:var(--rule);margin-top:0;border-block:1px solid var(--rule);
  margin-inline:calc(var(--gut) * -1);
}
@media(min-width:760px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{background:var(--ink);padding:30px clamp(18px,3vw,34px)}
.fact-n{font-family:var(--font-disp);font-size:clamp(38px,5.4vw,56px);line-height:1;font-weight:400;letter-spacing:-.02em}
.fact-n sup{font-size:.44em;vertical-align:super;letter-spacing:0}
.fact-l{margin-top:10px;color:var(--bone-3);font-size:13.5px;line-height:1.45;font-weight:300;max-width:22ch}

/* ---------- FAIXA DE ATLETAS ---------- */
.marq{
  margin-inline:calc(var(--gut) * -1);border-bottom:1px solid var(--rule);
  overflow:hidden;padding-block:20px;background:var(--ink-2);
}
.marq-track{display:flex;gap:52px;width:max-content;animation:slide 46s linear infinite;padding-inline:26px;align-items:center}
@keyframes slide{to{transform:translateX(-50%)}}
.marq-i{
  font-family:var(--font-disp);font-size:17px;font-weight:400;font-style:italic;
  color:rgba(246,241,234,.34);white-space:nowrap;display:flex;gap:52px;align-items:center;
}
.marq-i b{font-style:normal;font-weight:500;color:rgba(246,241,234,.62)}
.marq-i.ao b{color:var(--acc)}
.marq-i::after{content:'·';color:rgba(246,241,234,.2);font-size:20px}

/* ---------- ANGOLA EM MOVIMENTO: TRÍPTICO FOTOGRÁFICO ---------- */
.trio{display:grid;gap:clamp(28px,4vw,44px);margin-top:clamp(44px,6vw,70px)}
@media(min-width:900px){.trio{grid-template-columns:repeat(3,1fr)}}
.trio-card{display:flex;flex-direction:column}
.trio-photo{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:3px;background:var(--ink-3)}
.trio-photo img{width:100%;height:100%;object-fit:cover;filter:brightness(.9) contrast(1.06);transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.trio-card:hover .trio-photo img{transform:scale(1.045)}
.trio-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(10,9,7,.72) 100%)}
.trio-num{
  position:absolute;top:16px;left:16px;z-index:2;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:rgba(246,241,234,.8);
  background:rgba(10,9,7,.55);backdrop-filter:blur(10px);padding:6px 11px;border-radius:100px;
  border:1px solid rgba(246,241,234,.13);
}
.trio-cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,241,234,.72)}
.trio-body{padding-top:24px;display:flex;flex-direction:column;gap:13px}
.trio-body p{color:var(--bone-2);font-size:15px;line-height:1.62;font-weight:300}
.trio-stat{margin-top:auto;padding-top:20px;border-top:1px solid var(--rule);display:flex;align-items:baseline;gap:12px}
.trio-stat b{font-family:var(--font-disp);font-size:34px;font-weight:400;line-height:1;color:var(--acc);letter-spacing:-.02em}
.trio-stat span{font-size:12.5px;color:var(--bone-3);line-height:1.4;font-weight:300}

/* ---------- DORES ---------- */
.pains{display:grid;gap:0;margin-top:clamp(44px,6vw,68px);border-top:1px solid var(--rule)}
@media(min-width:780px){.pains{grid-template-columns:repeat(2,1fr);column-gap:clamp(30px,5vw,64px)}}
.pain{padding-block:32px;border-bottom:1px solid var(--rule);display:flex;gap:22px;align-items:flex-start}
.pain-n{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--acc);padding-top:7px;flex:none}
.pain-body h3{margin-bottom:9px}
.pain-body p{color:var(--bone-2);font-size:15px;line-height:1.62;font-weight:300;max-width:46ch}
.pain-stat{margin-top:16px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--bone-3);text-transform:uppercase}
.pain-stat b{color:var(--bone);font-weight:600}

/* ---------- BLOCOS DE TECNOLOGIA (editorial, não bento) ---------- */
.tech{margin-top:clamp(44px,6vw,72px);display:flex;flex-direction:column;gap:clamp(46px,7vw,88px)}
.tech-row{display:grid;gap:clamp(26px,4vw,52px);align-items:center}
@media(min-width:940px){
  .tech-row{grid-template-columns:1fr 1fr}
  .tech-row.flip .tech-media{order:-1}
}
.tech-copy h3{margin-bottom:12px}
.tech-copy p{color:var(--bone-2);font-size:15.5px;line-height:1.66;font-weight:300;max-width:50ch}
.tech-media{
  border:1px solid var(--rule);border-radius:4px;background:var(--ink-2);
  padding:clamp(22px,3.4vw,34px);
}
.tech-media.wide{padding:0;overflow:hidden}

/* anel de recuperação */
.ring-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring-svg{width:140px;height:140px;flex:none}
.ring-bg{fill:none;stroke:var(--rule-2);stroke-width:7}
.ring-fg{fill:none;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring-txt{font-family:var(--font-disp);font-size:34px;font-weight:400;fill:var(--bone);text-anchor:middle}
.ring-sub{font-family:var(--font-mono);font-size:8px;letter-spacing:.14em;fill:var(--bone-3);text-anchor:middle;text-transform:uppercase}
.ring-copy{flex:1;min-width:180px}
.verdict{font-family:var(--font-disp);font-size:30px;font-weight:400;line-height:1.05;font-style:italic;color:var(--rec)}
.verdict-note{font-size:14.5px;color:var(--bone-2);margin-top:9px;line-height:1.6;font-weight:300}

/* barras de métricas */
.mbars{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.mbar{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center}
.mbar-l{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-3)}
.mbar-t{height:6px;background:var(--rule-2);border-radius:100px;overflow:hidden}
.mbar-f{height:100%;border-radius:100px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.mbar-v{font-family:var(--font-mono);font-size:11px;color:var(--bone-2);min-width:34px;text-align:right}

/* sono */
.sleep-bar{display:flex;gap:2px;height:26px;margin-top:8px;border-radius:3px;overflow:hidden}
.sleep-seg{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}
.legend-i{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--bone-2)}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.tip{
  margin-top:22px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:14.5px;line-height:1.62;color:var(--bone-2);font-weight:300;
}
.tip b{color:var(--bone);font-weight:600}
.tip .warn{color:var(--acc);font-weight:500}

/* gráfico de carga semanal */
.chart-cap{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3);margin-bottom:16px;display:block}
.bar-svg{width:100%;height:auto;overflow:visible}
.grid-line{stroke:var(--rule);stroke-width:1}
.axis-txt{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;fill:var(--bone-3);text-transform:uppercase}

/* lista de actividades — UMA cor (uma série = uma cor) */
.acts{display:flex;flex-direction:column;gap:15px;margin-top:26px}
.act{display:flex;flex-direction:column;gap:7px}
.act-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.act-l{font-size:14.5px;color:var(--bone);font-weight:400}
.act-v{font-family:var(--font-mono);font-size:11.5px;color:var(--bone-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.act-track{height:7px;background:var(--rule-2);border-radius:100px;overflow:hidden}
.act-fill{height:100%;background:var(--acc);border-radius:100px}

/* ---------- SIMULADOR ---------- */
.sim{
  margin-top:clamp(44px,6vw,70px);border:1px solid var(--rule);border-radius:4px;
  overflow:hidden;background:var(--ink-2);
}
@media(min-width:900px){.sim{display:grid;grid-template-columns:1.08fr .92fr}}
.sim-l{padding:clamp(26px,4vw,46px)}
.sim-r{
  padding:clamp(26px,4vw,46px);border-top:1px solid var(--rule);display:flex;flex-direction:column;
  background:linear-gradient(155deg,rgba(228,87,46,.09),transparent 62%);
}
@media(min-width:900px){.sim-r{border-top:0;border-left:1px solid var(--rule)}}
.ctl{margin-bottom:34px}
.ctl:last-of-type{margin-bottom:0}
.ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:14px}
.ctl-l{font-size:15px;color:var(--bone-2);font-weight:400}
.ctl-v{font-family:var(--font-disp);font-size:26px;font-weight:500;line-height:1;color:var(--acc)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--rule-2);
  border-radius:100px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--bone);
  border:4px solid var(--ink-2);box-shadow:0 0 0 1px var(--bone);cursor:grab;
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--bone);
  border:4px solid var(--ink-2);box-shadow:0 0 0 1px var(--bone);cursor:grab;
}
input[type=range]:focus-visible{outline:2px solid var(--acc);outline-offset:6px}
.ctl-hint{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3);margin-top:10px;display:flex;justify-content:space-between}
.age-out{font-family:var(--font-disp);font-weight:400;font-size:clamp(76px,15vw,124px);line-height:.86;letter-spacing:-.035em}
.age-out.worse{color:var(--acc)}
.age-out.better{color:var(--rec)}
.age-cap{font-size:14px;color:var(--bone-2);margin-top:10px;max-width:34ch;line-height:1.5}
.age-delta{
  font-family:var(--font-mono);font-size:12.5px;font-weight:500;letter-spacing:.02em;
  margin-top:26px;padding:15px 18px;border:1px solid var(--rule-2);border-radius:3px;
}
.age-delta.pos{color:var(--acc);border-color:rgba(228,87,46,.42);background:rgba(228,87,46,.08)}
.age-delta.neg{color:var(--rec);border-color:rgba(57,168,87,.42);background:rgba(57,168,87,.08)}
.age-note{font-size:14px;color:var(--bone-3);margin-top:auto;padding-top:26px;line-height:1.62;font-weight:300}

/* ---------- COMPARATIVO ---------- */
.tbl-scroll{overflow-x:auto;margin-top:clamp(40px,5vw,60px);-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:4px}
table.cmp{border-collapse:collapse;width:100%;min-width:660px}
table.cmp th,table.cmp td{padding:17px 20px;text-align:left;border-bottom:1px solid var(--rule);font-size:14.5px}
table.cmp thead th{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--bone-3);background:var(--ink-2);font-weight:500;white-space:nowrap;
}
table.cmp thead th.hl{color:var(--acc)}
table.cmp tbody th{font-weight:400;color:var(--bone-2);font-size:14.5px}
table.cmp tbody td{color:var(--bone);font-weight:400}
table.cmp td.hl{background:rgba(228,87,46,.06);font-weight:500}
table.cmp tbody tr:last-child th,table.cmp tbody tr:last-child td{border-bottom:0}
.t-y{color:var(--rec)}
.t-n{color:var(--bone-3)}

/* ---------- TESTEMUNHOS ---------- */
.tsts{display:grid;gap:1px;background:var(--rule);margin-top:clamp(40px,5vw,60px);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
@media(min-width:720px){.tsts{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1060px){.tsts{grid-template-columns:repeat(3,1fr)}}
.tst{background:var(--ink-2);padding:clamp(24px,3vw,32px);display:flex;flex-direction:column;gap:18px}
.tst-q{font-size:15.5px;line-height:1.66;color:var(--bone);flex:1;font-weight:300}
.tst-who{display:flex;align-items:center;gap:13px;padding-top:18px;border-top:1px solid var(--rule)}
.tst-av{
  width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-family:var(--font-disp);font-size:15px;font-weight:500;color:var(--acc);
  background:var(--acc-soft);border:1px solid rgba(228,87,46,.28);
}
.tst-n{font-weight:600;font-size:14.5px;line-height:1.3}
.tst-m{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--bone-3);margin-top:4px}

/* ---------- PLANOS ---------- */
.plans{display:grid;gap:clamp(20px,3vw,28px);margin-top:clamp(40px,5vw,60px)}
@media(min-width:860px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{
  border:1px solid var(--rule);border-radius:4px;padding:clamp(26px,3.4vw,36px);
  display:flex;flex-direction:column;gap:18px;background:var(--ink-2);position:relative;
}
.plan.feat{border-color:rgba(228,87,46,.42);background:linear-gradient(165deg,rgba(228,87,46,.10),var(--ink-2) 55%)}
.plan-badge{
  position:absolute;top:-1px;left:clamp(26px,3.4vw,36px);
  font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;background:var(--acc);color:#fff;padding:6px 12px;border-radius:0 0 3px 3px;
}
