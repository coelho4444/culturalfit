<title>WHOOP 5.0 · Luanda</title>
<meta name="description" content="WHOOP 5.0 em Luanda. A pulseira que mede sono, recuperação, esforço e stress. Entrega em 24 horas, preços em kwanzas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* Paleta: vidro fumado sobre o dourado da Marginal */
  --bg-deep:rgba(12, 10, 8, 0.72);
  --glass:rgba(16, 13, 10, 0.62);
  --glass-hover:rgba(22, 18, 14, 0.78);
  --glass-border:rgba(255, 238, 210, 0.16);
  --glass-border-hi:rgba(255, 238, 210, 0.32);
  --text-main:#fffefb;
  --text-soft:rgba(255, 250, 240, 0.82);
  --text-dim:rgba(255, 245, 230, 0.58);
  --acc:#ff6332;
  --acc-glow:rgba(255, 99, 50, 0.32);
  --acc-bright:#ff7a4d;
  --font-disp:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:22px;
  --max:1140px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:#0e0b08}

/* ---------- FUNDO FIXO CONTÍNUO: A TUA IMAGEM DA MARGINAL ---------- */
/* Fundo exterior: a mesma imagem ampliada com blur suave para preencher qualquer monitor */
body::before{
  content:'';
  position:fixed;
  inset:-30px;
  z-index:-3;
  background-image:url("MARGINAL_USER_IMG");
  background-size:cover;
  background-position:center 45%;
  background-repeat:no-repeat;
  filter:blur(22px) brightness(0.78) saturate(1.15);
  transform:scale(1.06);
}

/* Fundo principal: a imagem DESAMPLIADA, com perspectiva inteira da Marginal,
   sem cortes forçados, mostrando toda a calçada, corredores, mar e céu */
body{
  color:var(--text-main);
  font-family:var(--font-body);font-size:16.5px;line-height:1.66;
  font-weight:400;letter-spacing:-.004em;
  overflow-x:hidden;
  padding-inline:var(--gut);
  padding-block:0 env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
  position:relative;
  min-height:100vh;
  /* Imagem desampliada e nítida ao centro */
  background-image:url("MARGINAL_USER_IMG");
  background-repeat:no-repeat;
  background-attachment:fixed;
  background-position:center 20%;
  background-size:min(100vw, 1180px) auto;
}

@media(min-aspect-ratio: 16/10){
  body{
    /* Em ecrãs widescreen, ajusta pela altura para ver o topo e a base completos */
    background-size:auto 100vh;
  }
}
@media(max-width: 768px){
  body{
    background-size:cover;
    background-position:center 25%;
  }
}

/* Sem branco leitoso e sem escuro pesado: a foto brilha limpa */
body::after{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(180deg, rgba(8,6,4,0.32) 0%, rgba(8,6,4,0.12) 35%, rgba(8,6,4,0.38) 100%);
  pointer-events:none;
}

.wrap{width:100%;max-width:var(--max);margin-inline:auto;position:relative;z-index:2}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--font-body);font-variant-numeric:tabular-nums}

/* ---------- TIPOGRAFIA ---------- */
h1,h2,h3{font-family:var(--font-disp);font-weight:400;text-wrap:balance;font-variation-settings:'SOFT' 0,'WONK' 0}
h1{
  font-size:clamp(44px,7.8vw,92px);
  line-height:.98;letter-spacing:-.026em;
  text-shadow:0 3px 24px rgba(0,0,0,0.65), 0 1px 3px rgba(0,0,0,0.85);
}
h2{
  font-size:clamp(32px,4.8vw,56px);line-height:1.04;letter-spacing:-.022em;
  text-shadow:0 2px 18px rgba(0,0,0,0.55);
}
h3{
  font-size:clamp(21px,2.4vw,28px);line-height:1.18;letter-spacing:-.014em;font-weight:500;
  text-shadow:0 2px 14px rgba(0,0,0,0.5);
}
h1 em,h2 em{font-style:italic;color:var(--acc);text-shadow:0 0 28px var(--acc-glow)}
.eyebrow{
  font-size:11.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--acc);
  text-shadow:0 1px 8px rgba(0,0,0,0.7);
}
.lede{
  color:var(--text-soft);font-size:clamp(16.5px,1.8vw,20px);line-height:1.6;
  max-width:56ch;margin-top:20px;font-weight:400;
  text-shadow:0 2px 12px rgba(0,0,0,0.7);
}
section{position:relative;isolation:isolate}
.sec-pad{padding-block:clamp(70px,10vw,128px)}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:rgba(12, 10, 8, 0.72);
  backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--glass-border);
  margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);
}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;max-width:var(--max);margin-inline:auto}
.brand{font-family:var(--font-disp);font-size:24px;font-weight:500;letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px}
.brand i{font-style:italic;color:var(--acc)}
.topstat{display:none;gap:20px;align-items:center;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim);font-weight:500}
@media(min-width:760px){.topstat{display:flex}}
.topstat b{color:var(--text-main);font-weight:700}
.top-cta{
  font-size:13px;font-weight:700;background:var(--acc);color:#fff;
  padding:10px 18px;border-radius:100px;white-space:nowrap;transition:all .2s ease;
  box-shadow:0 4px 18px var(--acc-glow);
}
.top-cta:hover{background:var(--acc-bright);transform:translateY(-1px)}

/* ---------- BOTÕES ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;justify-content:center;
  font-size:15px;font-weight:700;letter-spacing:.005em;
  padding:16px 28px;border-radius:100px;border:1px solid transparent;cursor:pointer;
  transition:all .2s cubic-bezier(.2,.7,.3,1);
}
.btn:hover{transform:translateY(-2px)}
.btn-wa{
  background:var(--acc);color:#fff;
  box-shadow:0 8px 26px var(--acc-glow);
}
.btn-wa:hover{background:var(--acc-bright);box-shadow:0 12px 32px rgba(255,99,50,0.48)}
.btn-ghost{
  border-color:var(--glass-border-hi);color:var(--text-main);
  background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);
}
.btn-ghost:hover{
  border-color:#fff;background:rgba(255,255,255,0.18);
}
.btn-dark{
  background:rgba(255,255,255,0.12);color:#fff;
  border:1px solid var(--glass-border-hi);backdrop-filter:blur(8px);
}
.btn-dark:hover{background:var(--acc);border-color:var(--acc)}

/* ---------- HERO ---------- */
.hero{position:relative;isolation:isolate}
.hero-in{
  max-width:var(--max);margin-inline:auto;position:relative;z-index:2;
  padding-block:clamp(80px,14vw,150px) clamp(50px,8vw,90px);
  min-height:min(86vh,820px);display:flex;flex-direction:column;justify-content:flex-end;
}
.hero-in > *{max-width:860px}
.hero h1{margin-top:18px}
.hero .lede{max-width:50ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:34px}
.hero-credit{
  position:absolute;right:0;bottom:14px;z-index:3;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,0.45);writing-mode:vertical-rl;
  text-shadow:0 1px 6px rgba(0,0,0,0.8);
}
@media(max-width:820px){.hero-credit{display:none}}

/* ---------- FAIXA DE ATLETAS (VIDRO TRANSLÚCIDO) ---------- */
.marq{
  margin-inline:calc(var(--gut) * -1);
  border-block:1px solid var(--glass-border);
  overflow:hidden;padding-block:16px;
  background:rgba(12, 10, 8, 0.55);
  backdrop-filter:blur(12px);
}
.marq-track{display:flex;gap:46px;width:max-content;animation:slide 52s linear infinite;padding-inline:22px;align-items:center}
@keyframes slide{to{transform:translateX(-50%)}}
.marq-i{font-family:var(--font-disp);font-size:17px;font-style:italic;color:var(--text-dim);white-space:nowrap;display:flex;gap:46px;align-items:center}
.marq-i b{font-style:normal;font-weight:500;color:var(--text-main)}
.marq-i.ao b{color:var(--acc)}
.marq-i::after{content:'·';color:var(--glass-border-hi);font-size:20px}

/* ---------- CABEÇALHO DE SECÇÃO ---------- */
.sec-head{max-width:760px;margin-bottom:clamp(36px,5vw,56px)}

/* ---------- PARA QUE SERVE (CARDS DE VIDRO FUMADO) ---------- */
.serves{display:flex;flex-direction:column;gap:clamp(32px,5vw,64px)}
.serve{
  display:grid;gap:clamp(22px,3.4vw,44px);align-items:center;
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);
  border-radius:12px;
  padding:clamp(24px,3.5vw,42px);
  box-shadow:0 24px 50px -20px rgba(0,0,0,0.6);
  transition:all .3s ease;
}
.serve:hover{
  background:var(--glass-hover);
  border-color:var(--glass-border-hi);
  transform:translateY(-2px);
}
@media(min-width:880px){
  .serve{grid-template-columns:1.05fr .95fr}
  .serve.flip .serve-media{order:-1}
}
.serve-copy h3{margin-bottom:12px}
.serve-copy p{color:var(--text-soft);font-size:16px;line-height:1.64;max-width:46ch}
.serve-media{
  position:relative;border-radius:8px;overflow:hidden;background:#000;
  border:1px solid var(--glass-border);aspect-ratio:4/3;
  box-shadow:0 16px 36px -16px rgba(0,0,0,0.7);
}
.serve-media img{width:100%;height:100%;object-fit:cover}

/* ---------- SLOT DE VÍDEO ---------- */
.vslot{position:relative;width:100%;height:100%;display:block;background:#000;border:0;padding:0;cursor:pointer}
.vslot img{width:100%;height:100%;object-fit:cover;opacity:.88;transition:transform .4s ease}
.vslot:hover img{transform:scale(1.03)}
.vslot-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:64px;height:64px;border-radius:50%;
  background:rgba(255,255,255,0.92);border:0;cursor:pointer;
  display:grid;place-items:center;transition:all .2s ease;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.vslot:hover .vslot-play{transform:translate(-50%,-50%) scale(1.1);background:#fff}
.vslot-play::after{
  content:'';width:0;height:0;margin-left:4px;
  border-left:17px solid #111;border-top:11px solid transparent;border-bottom:11px solid transparent;
}
.vslot-tag{
  position:absolute;left:12px;top:12px;
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  background:rgba(0,0,0,0.78);color:#fff;padding:6px 11px;border-radius:100px;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.18);
}
.vslot-note{
  position:absolute;left:12px;right:12px;bottom:12px;
  font-size:12px;line-height:1.4;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,0.95);
  font-weight:500;
}

/* ---------- PRODUTO (WHOOP 5.0 NO PULSO) ---------- */
.produto{
  display:grid;gap:clamp(26px,4vw,54px);align-items:center;
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);
  border-radius:12px;
  padding:clamp(28px,4.5vw,52px);
  box-shadow:0 24px 50px -20px rgba(0,0,0,0.6);
}
@media(min-width:860px){.produto{grid-template-columns:.95fr 1.05fr}}
.produto-shot{
  border-radius:8px;overflow:hidden;background:#000;
  border:1px solid var(--glass-border);box-shadow:0 20px 40px -20px rgba(0,0,0,0.7);
}
.produto-shot img{width:100%;height:auto}
.produto-copy h3{font-size:clamp(26px,3.2vw,36px)}
.produto-copy p{color:var(--text-soft);margin-top:14px;max-width:44ch}
.specs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--glass-border);border:1px solid var(--glass-border);
  border-radius:8px;margin-top:28px;overflow:hidden;
}
.spec{background:rgba(18, 14, 11, 0.72);padding:18px 14px}
.spec-n{font-family:var(--font-disp);font-size:28px;line-height:1;letter-spacing:-.02em;color:var(--acc)}
.spec-l{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);margin-top:7px;font-weight:600;line-height:1.3}

/* ---------- PLANOS ---------- */
.plans{display:grid;gap:clamp(18px,2.5vw,26px);margin-top:clamp(30px,4vw,46px)}
@media(min-width:860px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{
  border:1px solid var(--glass-border);border-radius:12px;padding:clamp(26px,3.2vw,36px);
  display:flex;flex-direction:column;gap:16px;position:relative;
  background:var(--glass);
  backdrop-filter:blur(18px);
  box-shadow:0 20px 44px -20px rgba(0,0,0,0.6);
  transition:all .3s ease;
}
.plan:hover{
  background:var(--glass-hover);
  border-color:var(--glass-border-hi);
  transform:translateY(-3px);
}
.plan.feat{
  border-color:rgba(255, 99, 50, 0.65);
  background:linear-gradient(170deg, rgba(255,99,50,0.18) 0%, rgba(18,14,11,0.78) 55%);
  box-shadow:0 26px 60px -24px var(--acc-glow);
}
.plan-badge{
  position:absolute;top:-1px;left:clamp(26px,3.2vw,36px);
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  background:var(--acc);color:#fff;padding:6px 14px;border-radius:0 0 4px 4px;
  box-shadow:0 4px 14px var(--acc-glow);
}
.plan-name{font-family:var(--font-disp);font-size:32px;font-style:italic;line-height:1}
.plan-price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:4px}
.plan-cur{font-size:14px;color:var(--text-dim);font-weight:600}
.plan-num{font-family:var(--font-disp);font-size:52px;line-height:.9;letter-spacing:-.026em;color:var(--text-main)}
.plan-per{font-size:12.5px;color:var(--text-dim);font-weight:600}
.plan-desc{font-size:14.5px;color:var(--text-soft);line-height:1.5;padding-bottom:18px;border-bottom:1px solid var(--glass-border)}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:11px;flex:1}
.plan li{display:flex;gap:11px;font-size:14.5px;color:var(--text-soft);line-height:1.5;align-items:flex-start}
.plan li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;margin-top:8px}
.plan .btn{width:100%;margin-top:8px}
.plan-note{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);text-align:center;font-weight:600}
.plan-legal{
  font-size:13px;color:var(--text-dim);margin-top:20px;line-height:1.65;
  background:rgba(12,10,8,0.5);padding:16px 20px;border-radius:8px;
  border:1px solid var(--glass-border);
}

/* ---------- FAQ ---------- */
.faq{
  margin-top:clamp(24px,3.5vw,40px);
  background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);border-radius:12px;
  padding:clamp(16px,3vw,32px);
  box-shadow:0 20px 44px -20px rgba(0,0,0,0.6);
}
details{border-bottom:1px solid var(--glass-border)}
details:last-child{border-bottom:0}
details summary{
  list-style:none;cursor:pointer;padding:22px 4px;display:flex;justify-content:space-between;
  align-items:center;gap:20px;font-family:var(--font-disp);
  font-size:clamp(18.5px,2.2vw,24px);line-height:1.24;letter-spacing:-.01em;
}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';font-family:var(--font-body);font-size:24px;font-weight:400;color:var(--acc);flex:none;transition:transform .22s ease}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 4px 24px;color:var(--text-soft);font-size:15.5px;max-width:70ch;line-height:1.66}

/* ---------- CTA FINAL ---------- */
.final{
  background:linear-gradient(180deg, var(--glass) 0%, rgba(20, 16, 12, 0.85) 100%);
  backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  border-radius:14px;
  padding:clamp(40px,7vw,76px) clamp(26px,5vw,56px);
  box-shadow:0 28px 64px -20px rgba(0,0,0,0.7);
  margin-top:clamp(40px,6vw,70px);
}
.final-in > *{max-width:680px}
.final h2{margin-top:16px}
.final p{color:var(--text-soft);font-size:17.5px;margin-top:20px;max-width:48ch}
.final-actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:32px}
.assure{display:grid;grid-template-columns:1fr;gap:12px;margin-top:36px;max-width:600px}
@media(min-width:540px){.assure{grid-template-columns:1fr 1fr}}
.assure div{font-size:14px;color:var(--text-soft);display:flex;gap:10px;align-items:flex-start;line-height:1.45;font-weight:500}
.assure div::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;margin-top:7px}

/* ---------- FOOTER ---------- */
footer{
  margin-inline:calc(var(--gut) * -1);
  border-top:1px solid var(--glass-border);
  padding-inline:var(--gut);padding-block:48px calc(48px + env(safe-area-inset-bottom,0px));
  background:rgba(10, 8, 6, 0.82);
  backdrop-filter:blur(20px);
  margin-top:clamp(60px,8vw,100px);
}
.foot{max-width:var(--max);margin-inline:auto;display:flex;flex-direction:column;gap:30px}
.foot-brand{font-family:var(--font-disp);font-size:28px}
.foot-brand i{font-style:italic;color:var(--acc)}
.foot-grid{display:grid;gap:26px}
@media(min-width:720px){.foot-grid{grid-template-columns:repeat(3,1fr)}}
.foot-c{display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--text-soft)}
.foot-c strong{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin-bottom:2px}
.foot-c a:hover{color:var(--acc)}
.foot-legal{font-size:12px;color:var(--text-dim);line-height:1.68;border-top:1px solid var(--glass-border);padding-top:24px;max-width:92ch}

/* ---------- REVEAL ---------- */
.rv{opacity:1;transform:none}
@media(prefers-reduced-motion:no-preference){
  .has-js .rv{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1)}
  .has-js .rv.in{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  .marq-track{animation:none}
  html{scroll-behavior:auto}
}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
</style>
